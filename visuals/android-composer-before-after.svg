<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".42"/>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="11"/></filter>
    <clipPath id="afterMenuClip"><rect x="822" y="174" width="486" height="348" rx="24"/></clipPath>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { fill:#a3a3a3; font-size:18px; font-weight:700; letter-spacing:2px; }
      .title { fill:#f5f5f5; font-size:26px; font-weight:700; }
      .body { fill:#e5e5e5; font-size:18px; }
      .muted { fill:#8e8e93; font-size:16px; }
      .menuTitle { fill:#8e8e93; font-size:14px; font-weight:700; letter-spacing:2px; }
      .menuMain { fill:#f5f5f5; font-size:19px; font-weight:600; }
      .menuSub { fill:#8e8e93; font-size:14px; }
    </style>
  </defs>

  <rect width="1440" height="960" fill="#050505"/>
  <text x="360" y="54" text-anchor="middle" class="label">CURRENT ANDROID</text>
  <text x="1080" y="54" text-anchor="middle" class="label">PROPOSED</text>

  <!-- Current phone -->
  <rect x="72" y="82" width="576" height="810" rx="42" fill="#0a0a0a" stroke="#2b2b2b" stroke-width="3"/>
  <rect x="254" y="98" width="212" height="24" rx="12" fill="#000"/>
  <text x="112" y="157" class="title">T3 Code</text>
  <text x="608" y="157" text-anchor="end" class="muted">Android · dark</text>
  <line x1="92" y1="177" x2="628" y2="177" stroke="#242424"/>
  <rect x="112" y="208" width="410" height="72" rx="22" fill="#171717"/>
  <text x="136" y="238" class="body">Can you audit the mobile composer?</text>
  <text x="136" y="263" class="muted">The skills menu overlaps this text.</text>
  <rect x="176" y="310" width="432" height="82" rx="22" fill="#1f5f43"/>
  <text x="202" y="343" class="body">I’ll inspect the native editor and</text>
  <text x="202" y="369" class="body">the Android surface implementation.</text>
  <text x="110" y="454" class="muted">Reading apps/mobile/src/features/threads…</text>
  <text x="110" y="493" class="body">The command popover currently falls back</text>
  <text x="110" y="521" class="body">to a translucent View on Android.</text>

  <!-- Sharp translucent popover -->
  <g filter="url(#shadow)">
    <rect x="132" y="174" width="486" height="348" rx="24" fill="#171717" fill-opacity=".78" stroke="#ffffff" stroke-opacity=".08"/>
    <text x="158" y="211" class="menuTitle">SKILLS</text>
    <line x1="132" y1="226" x2="618" y2="226" stroke="#fff" stroke-opacity=".07"/>
    <text x="158" y="264" class="menuMain">◈  frontend-design</text>
    <text x="158" y="286" class="menuSub">Build polished application interfaces</text>
    <line x1="152" y1="305" x2="598" y2="305" stroke="#fff" stroke-opacity=".06"/>
    <text x="158" y="344" class="menuMain">◈  github</text>
    <text x="158" y="366" class="menuSub">Work with repositories and pull requests</text>
    <line x1="152" y1="385" x2="598" y2="385" stroke="#fff" stroke-opacity=".06"/>
    <text x="158" y="424" class="menuMain">◈  imagegen</text>
    <text x="158" y="446" class="menuSub">Generate or edit raster images</text>
    <line x1="152" y1="465" x2="598" y2="465" stroke="#fff" stroke-opacity=".06"/>
    <text x="158" y="500" class="menuMain">◈  documents</text>
  </g>

  <!-- Current composer -->
  <rect x="98" y="738" width="524" height="112" rx="30" fill="#141414" stroke="#ffffff" stroke-opacity=".08"/>
  <text x="122" y="774" class="muted">Message T3 Code</text>
  <rect x="122" y="792" width="236" height="34" rx="9" fill="#e9efff" stroke="#b9c8f5"/>
  <text x="137" y="815" fill="#f0abfc" font-size="16" font-weight="600">frontend-design</text>
  <circle cx="584" cy="811" r="24" fill="#f5f5f5"/><path d="M576 812l8-8 8 8m-8-8v16" fill="none" stroke="#0a0a0a" stroke-width="3"/>
  <text x="98" y="877" fill="#ef8c8c" font-size="15">rgba() rejected → pale fallback chip</text>

  <!-- Proposed phone -->
  <rect x="792" y="82" width="576" height="810" rx="42" fill="#0a0a0a" stroke="#2b2b2b" stroke-width="3"/>
  <rect x="974" y="98" width="212" height="24" rx="12" fill="#000"/>
  <text x="832" y="157" class="title">T3 Code</text>
  <text x="1328" y="157" text-anchor="end" class="muted">Android · dark</text>
  <line x1="812" y1="177" x2="1348" y2="177" stroke="#242424"/>

  <!-- Background conversation -->
  <g id="afterBackdrop">
    <rect x="832" y="208" width="410" height="72" rx="22" fill="#171717"/>
    <text x="856" y="238" class="body">Can you audit the mobile composer?</text>
    <text x="856" y="263" class="muted">The skills menu overlaps this text.</text>
    <rect x="896" y="310" width="432" height="82" rx="22" fill="#1f5f43"/>
    <text x="922" y="343" class="body">I’ll inspect the native editor and</text>
    <text x="922" y="369" class="body">the Android surface implementation.</text>
    <text x="830" y="454" class="muted">Reading apps/mobile/src/features/threads…</text>
    <text x="830" y="493" class="body">The command popover currently falls back</text>
    <text x="830" y="521" class="body">to a translucent View on Android.</text>
  </g>
  <use href="#afterBackdrop" filter="url(#blur)" clip-path="url(#afterMenuClip)"/>

  <!-- Blurred popover -->
  <g filter="url(#shadow)">
    <rect x="852" y="174" width="486" height="348" rx="24" fill="#171717" fill-opacity=".82" stroke="#ffffff" stroke-opacity=".1"/>
    <text x="878" y="211" class="menuTitle">SKILLS</text>
    <line x1="852" y1="226" x2="1338" y2="226" stroke="#fff" stroke-opacity=".07"/>
    <text x="878" y="264" class="menuMain">◈  frontend-design</text>
    <text x="878" y="286" class="menuSub">Build polished application interfaces</text>
    <line x1="872" y1="305" x2="1318" y2="305" stroke="#fff" stroke-opacity=".06"/>
    <text x="878" y="344" class="menuMain">◈  github</text>
    <text x="878" y="366" class="menuSub">Work with repositories and pull requests</text>
    <line x1="872" y1="385" x2="1318" y2="385" stroke="#fff" stroke-opacity=".06"/>
    <text x="878" y="424" class="menuMain">◈  imagegen</text>
    <text x="878" y="446" class="menuSub">Generate or edit raster images</text>
    <line x1="872" y1="465" x2="1318" y2="465" stroke="#fff" stroke-opacity=".06"/>
    <text x="878" y="500" class="menuMain">◈  documents</text>
  </g>

  <!-- Proposed composer -->
  <rect x="818" y="738" width="524" height="112" rx="30" fill="#141414" stroke="#ffffff" stroke-opacity=".08"/>
  <text x="842" y="774" class="muted">Message T3 Code</text>
  <rect x="842" y="792" width="236" height="34" rx="9" fill="#261528" stroke="#6b2c73"/>
  <text x="857" y="815" fill="#f0abfc" font-size="16" font-weight="600">frontend-design</text>
  <circle cx="1304" cy="811" r="24" fill="#f5f5f5"/><path d="M1296 812l8-8 8 8m-8-8v16" fill="none" stroke="#0a0a0a" stroke-width="3"/>
  <text x="818" y="877" fill="#79d69c" font-size="15">real blur + authored rgba chip colors</text>
</svg>
